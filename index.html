    <script>
      (function () {
        try {
          var theme = localStorage.getItem('idlefantasy-dex:theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch {
          /* localStorage unavailable (private mode, etc.) - fall back to system */
        }
      })();
    </script>
